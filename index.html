<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Blog</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f2f2f2;
}

header{
    background:aqua;
    color:black;
    text-align:center;
    max-width:900px;
    margin:20px auto;
    padding:20px;
    border-radius:10px;
}

main{
    background:blueviolet;
    color:white;
    max-width:900px;
    margin:auto;
    padding:20px;
    border-radius:10px;
}

main img{
    width:100%;
    border-radius:10px;
    margin-bottom:20px;
}

article{
    background:white;
    color:black;
    padding:20px;
    border-radius:10px;
}

article img{
    width:100%;
    border-radius:10px;
    margin-bottom:15px;
}

.artigo-autor{
    color:gray;
    margin:10px 0;
}

.botoes{
    margin-top:20px;
}

button{
    padding:10px 20px;
    margin-right:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
    transition:.3s;
}

.btn-curtir{
    background:#ff4d6d;
    color:white;
}

.btn-like{
    background:#1877f2;
    color:white;
}

.btn-curtir:hover,
.btn-like:hover{
    transform:scale(1.05);
}
</style>

</head>
<body>

<header>
    <h1>Título Principal</h1>
    <p>Explicação breve sobre o blog.</p>
</header>

<main>

    <img src="Gemini_Generated_Image_i39jqfi39jqfi39j (2).png" alt="Imagem principal">

    <h2>Subtítulo</h2>

    <p>
        Escreva detalhadamente sobre o assunto do seu blog.
    </p>

    <br>

    <article>

        <img src="imagem-blog.png" alt="Imagem do artigo">

        <h2>Meu primeiro post</h2>

        <p class="artigo-autor">
            Por: Marcelo Paludetto
        </p>

        <p>
            Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de
            programação e curiosidades da área de tecnologia.
        </p>

        <div class="botoes">

            <button class="btn-curtir">
                ❤️ <span id="curtir">0</span>
            </button>

            <button class="btn-like">
                👍 <span id="like">0</span>
            </button>

        </div>

    </article>

</main>

<script>
// Botão Curtir
const btnCurtir = document.querySelector(".btn-curtir");
const contadorCurtir = document.getElementById("curtir");

let curtiu = false;
let curtidas = 0;

btnCurtir.addEventListener("click", function(){

    if(curtiu){
        curtidas--;
        curtiu = false;
        btnCurtir.style.background = "#ff4d6d";
    }else{
        curtidas++;
        curtiu = true;
        btnCurtir.style.background = "#b3002d";
    }

    contadorCurtir.textContent = curtidas;
});


// Botão Like
const btnLike = document.querySelector(".btn-like");
const contadorLike = document.getElementById("like");

let gostou = false;
let likes = 0;

btnLike.addEventListener("click", function(){

    if(gostou){
        likes--;
        gostou = false;
        btnLike.style.background = "#1877f2";
    }else{
        likes++;
        gostou = true;
        btnLike.style.background = "#0d47a1";
    }

    contadorLike.textContent = likes;
});
</script>

</body>
</html>
