<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Blog</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f2f2f2;
}

header{
    max-width:900px;
    margin:20px auto;
    padding:20px;
    background:aqua;
    text-align:center;
    border-radius:10px;
}

main{
    max-width:900px;
    margin:auto;
    padding:20px;
    background:blueviolet;
    color:white;
    border-radius:10px;
}

article{
    background:white;
    color:black;
    padding:20px;
    border-radius:10px;
    margin-top:20px;
}

img{
    width:100%;
    border-radius:10px;
    margin-bottom:15px;
}

button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:8px;
    background:#666;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button.curtido{
    background:#e60023;
}
</style>

</head>
<body>

<header>
    <h1>Título Principal</h1>
    <p>Explicação breve sobre o blog.</p>
</header>

<main>

    <article>

        <img src="imagem-blog.png" alt="Imagem do artigo">

        <h2>Meu primeiro post</h2>

        <p><strong>Por:</strong> Marcelo Paludetto</p>

        <p>
            Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação,
            HTML, CSS, JavaScript e curiosidades sobre tecnologia.
        </p>

        <button id="btnCurtir">
            <span id="iconeCurtir">🤍 Curtir</span> (<span id="contador">0</span>)
        </button>

    </article>

</main>

<script>
// Seleção dos elementos do DOM
const botao = document.getElementById("btnCurtir");
const icone = document.getElementById("iconeCurtir");
const contador = document.getElementById("contador");

let curtidas = 0;
let curtiu = false;

botao.addEventListener("click", function(){

    if(curtiu){
        // Remove a curtida
        curtidas--;
        curtiu = false;
        
        botao.classList.remove("curtido");
        icone.textContent = "🤍 Curtir";
    }else{
        // Adiciona a curtida
        curtidas++;
        curtiu = true;
        
        botao.classList.add("curtido");
        icone.textContent = "❤️ Curtido";
    }

    // Atualiza o valor do número do contador
    contador.textContent = curtidas;

});
</script>

</body>
</html>
